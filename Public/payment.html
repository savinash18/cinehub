<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineHub - Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #171129;
            color: #F7F1E8;
        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            padding: 0 45px;
            background: #171129;
            border-bottom: 1px solid #3b3155;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 25px;
            font-weight: bold;
            color: #F4C43D;
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo-icon {
            position: relative;
            width: 42px;
            height: 42px;
            border: 3px solid #F4C43D;
            border-radius: 50%;
        }

        .logo-play {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-40%, -50%);

            width: 0;
            height: 0;

            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #F4C43D;

            z-index: 2;
        }

        /* =========================================
           FOUR DOTS - INSIDE THE CIRCLE
        ========================================= */

        .logo-dot {
            position: absolute;

            width: 5px;
            height: 5px;

            background: #F4C43D;

            border-radius: 50%;

            z-index: 3;
        }

        .dot-top {
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

        .dot-right {
            right: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        .dot-bottom {
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
        }

        .dot-left {
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            width: 90%;
            max-width: 1000px;

            margin: 45px auto;
        }

        .title {
            text-align: center;

            font-size: 32px;

            color: #F4C43D;

            margin-bottom: 35px;
        }

        /* =========================================
           PAYMENT BOX
        ========================================= */

        .payment-box {
            background: #21183A;

            border: 1px solid #3b3155;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* =========================================
           DETAILS
        ========================================= */

        .details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 30px;
        }

        .detail-card {
            background: #171129;

            border: 1px solid #3b3155;

            border-radius: 12px;

            padding: 18px;
        }

        .detail-card h3 {
            margin-top: 0;

            color: #F4C43D;

            font-size: 17px;
        }

        .detail-card p {
            margin: 8px 0;

            font-size: 15px;
        }

        /* =========================================
           SEATS
        ========================================= */

        .seats-title {
            color: #F4C43D;

            margin-bottom: 12px;
        }

        .seat-list {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 30px;
        }

        .seat {
            background: #F4C43D;

            color: #171129;

            padding: 9px 14px;

            border-radius: 8px;

            font-weight: bold;
        }

        /* =========================================
           PAYMENT METHODS
        ========================================= */

        .methods-title {
            color: #F4C43D;

            margin-bottom: 15px;
        }

        .method {
            display: block;

            background: #171129;

            border: 1px solid #3b3155;

            padding: 16px;

            border-radius: 12px;

            margin-bottom: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        .method:hover {
            border-color: #F4C43D;
        }

        .method input {
            margin-right: 10px;

            accent-color: #F4C43D;
        }

        /* =========================================
           TOTAL
        ========================================= */

        .total-box {
            display: flex;

            justify-content: space-between;

            align-items: center;

            border-top: 1px solid #3b3155;

            margin-top: 25px;

            padding-top: 22px;
        }

        .total-label {
            font-size: 20px;

            font-weight: bold;
        }

        .total-price {
            font-size: 28px;

            font-weight: bold;

            color: #F4C43D;
        }

        /* =========================================
           PAY BUTTON
        ========================================= */

        .pay-btn {
            width: 100%;

            padding: 16px;

            margin-top: 25px;

            background: #F4C43D;

            color: #171129;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .pay-btn:hover {
            transform: translateY(-2px);

            background: #ffd85d;
        }

        .pay-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================================
           STATUS
        ========================================= */

        .status {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            text-align: center;

            background: #342044;

            border: 1px solid #F4C43D;

            color: #F7F1E8;
        }

        /* =========================================
           CONFIRMATION OVERLAY
        ========================================= */

        .confirm-overlay {
            position: fixed;

            inset: 0;

            background:
                rgba(10, 7, 20, 0.82);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            padding: 20px;
        }

        .confirm-box {
            width: 100%;

            max-width: 470px;

            background: #21183A;

            border: 1px solid #F4C43D;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55);

            animation: popup 0.2s ease;
        }

        @keyframes popup {

            from {
                opacity: 0;

                transform:
                    translateY(15px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }

        .confirm-title {
            text-align: center;

            color: #F4C43D;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .confirm-message {
            text-align: center;

            color: #F7F1E8;

            line-height: 1.6;

            margin-bottom: 22px;
        }

        .confirm-details {
            background: #171129;

            border: 1px solid #3b3155;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 22px;
        }

        .confirm-row {
            display: flex;

            justify-content: space-between;

            margin: 10px 0;
        }

        .confirm-row span:last-child {
            color: #F4C43D;

            font-weight: bold;

            text-align: right;
        }

        /* =========================================
           CONFIRM BUTTONS
        ========================================= */

        .confirm-buttons {
            display: flex;

            gap: 12px;
        }

        .cancel-btn,
        .confirm-pay-btn {
            flex: 1;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .cancel-btn {
            background: transparent;

            color: #F7F1E8;

            border: 1px solid #6a5c82;
        }

        .cancel-btn:hover {
            border-color: #F4C43D;

            color: #F4C43D;
        }

        .confirm-pay-btn {
            background: #F4C43D;

            color: #171129;

            border: none;
        }

        .confirm-pay-btn:hover {
            background: #ffd85d;
        }

        .confirm-pay-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            .container {
                width: 94%;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .payment-box {
                padding: 20px;
            }

            .confirm-box {
                padding: 22px;
            }

        }
.logo-text {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1;
}

.logo-text .cine {
  color: #f7f1e8;   /* WHITE */
}

.logo-text .hub {
  color: #f4c43d;   /* GOLD */
}

::selection {
    background: #F4C43D;
    color: #171129;
}

::-moz-selection {
    background: #F4C43D;
    color: #171129;
}
    </style>
</head>


<body>

    <!-- =========================================
         HEADER
    ========================================= -->

    <header>

     <div class="logo">

            <div class="logo-icon">

                <div class="logo-play"></div>

                <div class="logo-dot dot-top"></div>

                <div class="logo-dot dot-right"></div>

                <div class="logo-dot dot-bottom"></div>

                <div class="logo-dot dot-left"></div>

            </div>
        </div>
 <div class="logo-text">
  <span class="cine">CINE</span><span class="hub">HUB</span>
</div>

    </header>


    <!-- =========================================
         MAIN
    ========================================= -->

    <div class="container">

        <div class="title">
            Payment
        </div>


        <div class="payment-box">


            <!-- BOOKING DETAILS -->

            <div class="details">

                <div class="detail-card">

                    <h3>
                        Booking Details
                    </h3>

                    <p>
                        <strong>Movie:</strong>
                        <span id="movieName">
                            Loading...
                        </span>
                    </p>

                    <p>
                        <strong>Date:</strong>
                        <span id="showDate">
                            -
                        </span>
                    </p>

                    <p>
                        <strong>Time:</strong>
                        <span id="showTime">
                            -
                        </span>
                    </p>

                    <p>
                        <strong>Screen:</strong>
                        <span id="screenName">
                            -
                        </span>
                    </p>

                    <p>
                        <strong>Format:</strong>
                        <span id="variation">
                            -
                        </span>
                    </p>

                </div>


                <!-- SELECTED SEATS -->

                <div class="detail-card">

                    <h3>
                        Selected Seats
                    </h3>

                    <div
                        class="seat-list"
                        id="seatList"
                    ></div>

                </div>

            </div>


            <!-- PAYMENT METHODS -->

            <h3 class="methods-title">
                Select Payment Method
            </h3>


            <label class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="UPI"
                >

                UPI

            </label>


            <label class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="CARD"
                >

                Credit / Debit Card

            </label>


            <label class="method">

                <input
                    type="radio"
                    name="paymentMethod"
                    value="NETBANKING"
                >

                Net Banking

            </label>


            <!-- TOTAL -->

            <div class="total-box">

                <div class="total-label">
                    Total Amount
                </div>

                <div class="total-price">

                    ₹<span id="totalAmount">
                        0
                    </span>

                </div>

            </div>


            <!-- PAY -->

            <button
                class="pay-btn"
                id="payButton"
                onclick="openConfirmation()"
            >
                PAY NOW
            </button>


            <!-- STATUS -->

            <div
                class="status"
                id="status"
            ></div>

        </div>

    </div>


    <!-- =========================================
         CONFIRMATION
    ========================================= -->

    <div
        class="confirm-overlay"
        id="confirmOverlay"
    >

        <div class="confirm-box">

            <div class="confirm-title">
                Confirm Payment
            </div>


            <div class="confirm-message">

                Please verify your booking
                details before proceeding
                with the payment.

            </div>


            <div class="confirm-details">

                <div class="confirm-row">

                    <span>
                        Seats
                    </span>

                    <span id="confirmSeats">
                        -
                    </span>

                </div>


                <div class="confirm-row">

                    <span>
                        Payment Method
                    </span>

                    <span id="confirmMethod">
                        -
                    </span>

                </div>


                <div class="confirm-row">

                    <span>
                        Total Amount
                    </span>

                    <span>

                        ₹<span id="confirmAmount">
                            0
                        </span>

                    </span>

                </div>

            </div>


            <div class="confirm-buttons">

                <button
                    class="cancel-btn"
                    onclick="closeConfirmation()"
                >
                    CANCEL
                </button>


                <button
                    class="confirm-pay-btn"
                    id="confirmPayButton"
                    onclick="processPayment()"
                >
                    CONFIRM & PAY
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           URL PARAMETERS
        ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const showId =
            params.get("show_id");

        const movieId =
            params.get("movie_id");

	const movieTitle =
	    params.get("movie_title");

        const screen =
            params.get("screen");

        const variation =
            params.get("variation");

        const time =
            params.get("time");

        const date =
            params.get("date");

        const seats =
            params.get("seats") || "";

        const total =
            params.get("total") || "0";


        /* =========================================
           DISPLAY DETAILS
        ========================================= */

        document.getElementById(
            "showDate"
        ).textContent =
            date || "-";


        document.getElementById(
            "showTime"
        ).textContent =
            time || "-";


        document.getElementById(
            "screenName"
        ).textContent =
            screen || "-";


        document.getElementById(
            "variation"
        ).textContent =
            variation || "-";


        document.getElementById(
            "totalAmount"
        ).textContent =
            total;


        /* =========================================
           SEATS
        ========================================= */

        const seatArray =
            seats
                .split(",")
                .map(
                    seat =>
                        seat.trim()
                )
                .filter(Boolean);


        const seatList =
            document.getElementById(
                "seatList"
            );


        if (
            seatArray.length === 0
        ) {

            seatList.innerHTML = `
                <div style="color:#aaa;">
                    No seats selected
                </div>
            `;

        } else {

            seatArray.forEach(
                seatName => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "seat";

                    div.textContent =
                        seatName;

                    seatList.appendChild(
                        div
                    );

                }
            );

        }


/* =========================================
   MOVIE
========================================= */

document.getElementById(
    "movieName"
).textContent =
    movieTitle || "Movie";



        /* =========================================
           OPEN CONFIRMATION
        ========================================= */

        function openConfirmation() {

            const selectedMethod =
                document.querySelector(
                    'input[name="paymentMethod"]:checked'
                );


            const status =
                document.getElementById(
                    "status"
                );


            status.style.display =
                "none";


            if (!selectedMethod) {

                status.textContent =
                    "Please select a payment method.";

                status.style.display =
                    "block";

                return;

            }


            document.getElementById(
                "confirmSeats"
            ).textContent =
                seatArray.join(", ");


            document.getElementById(
                "confirmMethod"
            ).textContent =
                selectedMethod.value;


            document.getElementById(
                "confirmAmount"
            ).textContent =
                total;


            document.getElementById(
                "confirmOverlay"
            ).style.display =
                "flex";

        }


        /* =========================================
           CLOSE CONFIRMATION
        ========================================= */

        function closeConfirmation() {

            document.getElementById(
                "confirmOverlay"
            ).style.display =
                "none";

        }


        /* =========================================
           PROCESS PAYMENT
        ========================================= */

        async function processPayment() {

            const selectedMethod =
                document.querySelector(
                    'input[name="paymentMethod"]:checked'
                );


            if (!selectedMethod) {

                closeConfirmation();

                return;

            }


            const confirmButton =
                document.getElementById(
                    "confirmPayButton"
                );


            const payButton =
                document.getElementById(
                    "payButton"
                );


            confirmButton.disabled =
                true;


            confirmButton.textContent =
                "PROCESSING...";


            try {

                /* =================================
                   GET SEATS
                ================================= */

                const seatResponse =
                    await fetch(
                        `/api/shows/${showId}/seats`
                    );


                if (!seatResponse.ok) {

                    throw new Error(
                        "Unable to load seats."
                    );

                }


                const seatData =
                    await seatResponse.json();


                /* =================================
                   GET SEAT IDS
                ================================= */

                const seatIds =
                    seatArray.map(
                        seatName => {

                            const seat =
                                seatData.find(
                                    s =>
                                        s.seat_name ===
                                        seatName
                                );


                            if (!seat) {

                                throw new Error(
                                    `Seat ${seatName} not found.`
                                );

                            }


                            return seat.id;

                        }
                    );


                /* =================================
                   CREATE BOOKING
                ================================= */

                const response =
                    await fetch(
                        "/api/bookings",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    show_id:
                                        Number(
                                            showId
                                        ),

                                    seats:
                                        seatIds,

                                    amount:
                                        Number(
                                            total
                                        ),

                                    payment_method:
                                        selectedMethod.value

                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Payment failed."
                    );

                }


                /* =================================
                   SUCCESS PAGE
                ================================= */

                window.location.href =
                    `success.html` +

                    `?reference=${
                        encodeURIComponent(
                            data.booking_reference
                        )
                    }` +

                    `&movie_id=${
                        encodeURIComponent(
                            movieId
                        )
                    }` +

                    `&show_id=${
                        encodeURIComponent(
                            showId
                        )
                    }` +

                    `&screen=${
                        encodeURIComponent(
                            screen
                        )
                    }` +

                    `&variation=${
                        encodeURIComponent(
                            variation
                        )
                    }` +

                    `&time=${
                        encodeURIComponent(
                            time
                        )
                    }` +

                    `&date=${
                        encodeURIComponent(
                            date
                        )
                    }` +

                    `&seats=${
                        encodeURIComponent(
                            seats
                        )
                    }` +

                    `&total=${
                        encodeURIComponent(
                            total
                        )
                    }`;

            }

            catch (error) {

                closeConfirmation();


                const status =
                    document.getElementById(
                        "status"
                    );


                status.textContent =
                    error.message ||
                    "Something went wrong.";


                status.style.display =
                    "block";


                confirmButton.disabled =
                    false;


                confirmButton.textContent =
                    "CONFIRM & PAY";


                payButton.disabled =
                    false;

            }

        }


        /* =========================================
           CLICK OUTSIDE CONFIRM BOX
        ========================================= */

        document
            .getElementById(
                "confirmOverlay"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeConfirmation();

                    }

                }
            );

    </script>

</body>
</html>
