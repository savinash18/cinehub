<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CineHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: #222;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 25px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }

        .message {
            text-align: center;
            margin-bottom: 18px;
            color: #4caf50;
        }

        .error {
            color: #ff5252;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ddd;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .success {
            text-align: center;
            color: #4caf50;
        }
	::selection {
    background: #F4C43D;
    color: #171129;
}

::-moz-selection {
    background: #F4C43D;
    color: #171129;
}
    </style>
</head>

<body>

<div class="container">

    <h1>Forgot Password</h1>
    <p class="subtitle">Reset your CineHub password</p>

    <!-- ========================= -->
    <!-- STEP 1: ENTER EMAIL -->
    <!-- ========================= -->

    <div id="emailStep" class="step">

        <form action="/forgot-password" method="POST">

            <label for="email">Registered Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Send Verification Code
            </button>

        </form>

    </div>


    <!-- ========================= -->
    <!-- STEP 2: ENTER OTP -->
    <!-- ========================= -->

    <div id="otpStep" class="step">

        <p class="message">
            A verification code has been sent to your email.
        </p>

        <form action="/verify-otp" method="POST">

            <label for="otp">Enter Verification Code</label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter 6-digit code"
                maxlength="6"
                pattern="[0-9]{6}"
                required
            >

            <button type="submit">
                Verify Code
            </button>

        </form>

    </div>


    <!-- ========================= -->
    <!-- STEP 3: NEW PASSWORD -->
    <!-- ========================= -->

    <div id="passwordStep" class="step">

        <p class="message">
            Verification successful! Create your new password.
        </p>

        <form action="/reset-password" method="POST">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>


    <!-- ========================= -->
    <!-- ERROR MESSAGE -->
    <!-- ========================= -->

    <div id="errorMessage" class="message error"></div>

    <a href="/login.html" class="back">
        ← Back to Login
    </a>

</div>


<script>

    const params = new URLSearchParams(window.location.search);

    const emailStep = document.getElementById("emailStep");
    const otpStep = document.getElementById("otpStep");
    const passwordStep = document.getElementById("passwordStep");
    const errorMessage = document.getElementById("errorMessage");


    // =========================
    // DEFAULT
    // =========================

    emailStep.classList.add("active");


    // =========================
    // OTP SENT
    // =========================

    if (params.get("sent") === "1") {

        emailStep.classList.remove("active");
        otpStep.classList.add("active");

    }


    // =========================
    // OTP VERIFIED
    // =========================

    if (params.get("verified") === "1") {

        emailStep.classList.remove("active");
        otpStep.classList.remove("active");
        passwordStep.classList.add("active");

    }


    // =========================
    // ERRORS
    // =========================

    const error = params.get("error");

    if (error === "1") {

        errorMessage.textContent =
            "This email is not registered.";

    }

    else if (error === "nootp") {

        errorMessage.textContent =
            "Please request a verification code first.";

    }

    else if (error === "expired") {

        errorMessage.textContent =
            "Your verification code has expired. Please request a new one.";

    }

    else if (error === "wrongotp") {

        emailStep.classList.remove("active");
        otpStep.classList.add("active");

        errorMessage.textContent =
            "Incorrect verification code. Please try again.";

    }

    else if (error === "notverified") {

        errorMessage.textContent =
            "Please verify your email first.";

    }

    else if (error === "empty") {

        passwordStep.classList.add("active");
        emailStep.classList.remove("active");

        errorMessage.textContent =
            "Please enter both passwords.";

    }

    else if (error === "mismatch") {

        passwordStep.classList.add("active");
        emailStep.classList.remove("active");

        errorMessage.textContent =
            "Passwords do not match.";

    }

    else if (error === "short") {

        passwordStep.classList.add("active");
        emailStep.classList.remove("active");

        errorMessage.textContent =
            "Password must contain at least 6 characters.";

    }

</script>

</body>
</html>
